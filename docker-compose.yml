services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: patchwork
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - patchwork-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwork -d patchwork"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - patchwork-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  patchwork-postgres:
  patchwork-redis:
