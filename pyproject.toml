[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-ci-backend"
version = "0.1.0"
description = "Backend for the self-healing CI/CD and developer agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.16.1",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "rq==2.12.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["backend"]

